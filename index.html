<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GalaxCri</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#060814;
    --card:#101525;
    --card2:#151c30;
    --border:#ffffff12;
    --text:#ffffff;
    --muted:#929bb5;
    --purple:#795cff;
    --blue:#20d8ff;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 10%,#704cff44,transparent 35%),
        radial-gradient(circle at 85% 85%,#00d9ff2e,transparent 35%),
        var(--bg);
    overflow:hidden;
}

/* Звёзды */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.35;
    background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#fff 1px,transparent 1px);
    background-size:75px 75px,120px 120px;
    background-position:0 0,40px 60px;
}

/* Навигация */

header{
    position:relative;
    z-index:2;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    border-bottom:1px solid var(--border);

    background:#080b17cc;
    backdrop-filter:blur(20px);
}

.logoBox{
    display:flex;
    align-items:center;
    gap:12px;

    font-size:23px;
    font-weight:900;
}

.logo{
    width:44px;
    height:44px;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(135deg,var(--purple),var(--blue));

    box-shadow:
        0 8px 35px #6955ff66;

    font-size:23px;
}

.headerButtons{
    display:flex;
    gap:9px;
}

button{
    border:0;
    color:white;
    cursor:pointer;
    font-family:inherit;
    font-weight:750;
    transition:.2s;
}

.loginButton{
    padding:11px 18px;

    border-radius:12px;

    background:#ffffff09;
    border:1px solid #ffffff15;
}

.loginButton:hover{
    background:#ffffff15;
    transform:translateY(-2px);
}

.registerButton{
    padding:11px 18px;

    border-radius:12px;

    background:
        linear-gradient(135deg,var(--purple),var(--blue));

    box-shadow:
        0 8px 30px #6955ff44;
}

.registerButton:hover{
    transform:translateY(-2px) scale(1.03);
}

/* Главная */

main{
    position:relative;
    z-index:1;

    height:calc(100vh - 76px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 20px;

    overflow:auto;
}

.hero{
    width:min(1000px,100%);
    text-align:center;

    animation:heroIn .7s ease;
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.badge{
    display:inline-flex;

    padding:8px 14px;

    border-radius:30px;

    background:#ffffff08;
    border:1px solid #ffffff12;

    color:#aaa4ff;

    font-size:13px;

    margin-bottom:20px;
}

h1{
    font-size:clamp(55px,9vw,100px);

    line-height:.9;

    letter-spacing:-5px;

    margin-bottom:24px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #aaa4ff 45%,
            #62eaff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.description{
    max-width:650px;

    margin:auto;

    color:var(--muted);

    font-size:18px;

    line-height:1.65;
}

.mainButtons{
    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:32px;

    flex-wrap:wrap;
}

.bigButton{
    padding:15px 25px;

    border-radius:15px;

    font-size:15px;
}

.primary{
    background:
        linear-gradient(135deg,var(--purple),var(--blue));

    box-shadow:
        0 12px 40px #6655ff44;
}

.secondary{
    background:#ffffff09;
    border:1px solid #ffffff15;
}

.bigButton:hover{
    transform:translateY(-3px);
}

/* Возможности */

.features{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:55px;
}

.feature{
    text-align:left;

    padding:20px;

    border-radius:19px;

    background:#ffffff07;

    border:1px solid #ffffff0d;

    backdrop-filter:blur(15px);

    transition:.25s;
}

.feature:hover{
    transform:translateY(-5px);

    background:#ffffff0c;

    border-color:#ffffff1c;
}

.icon{
    font-size:27px;

    margin-bottom:12px;
}

.feature h3{
    margin-bottom:7px;
}

.feature p{
    color:#858fa9;

    font-size:13px;

    line-height:1.5;
}

.version{
    color:#515b75;

    font-size:11px;

    margin-top:25px;
}

/* Модальное окно */

.modal{
    position:fixed;

    inset:0;

    z-index:10;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#000000aa;

    backdrop-filter:blur(15px);
}

.modal.active{
    display:flex;

    animation:fade .2s ease;
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.modalCard{
    width:min(470px,100%);

    padding:30px;

    border-radius:26px;

    background:#111729;

    border:1px solid #ffffff16;

    box-shadow:
        0 30px 100px #000000aa;

    animation:modalIn .3s ease;
}

@keyframes modalIn{
    from{
        transform:scale(.93) translateY(15px);
        opacity:0;
    }

    to{
        transform:scale(1) translateY(0);
        opacity:1;
    }
}

.modalTop{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.modalTitle{
    font-size:27px;
    font-weight:850;
}

.close{
    width:34px;
    height:34px;

    border-radius:10px;

    background:#ffffff0a;

    font-size:20px;
}

.modalDescription{
    color:var(--muted);

    font-size:14px;

    line-height:1.55;

    margin-bottom:20px;
}

/* Переключатель */

.methodSwitch{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:5px;

    margin-bottom:15px;

    border-radius:14px;

    background:#080d1b;
}

.method{
    padding:11px;

    border-radius:10px;

    background:transparent;

    color:#78839f;
}

.method.active{
    background:#202744;
    color:white;
}

/* Поля */

.field{
    width:100%;

    padding:14px;

    margin-bottom:10px;

    border-radius:13px;

    border:1px solid #ffffff12;

    outline:none;

    background:#080d1b;

    color:white;

    font-size:14px;
}

.field:focus{
    border-color:#765cff;

    box-shadow:
        0 0 0 3px #765cff22;
}

.field::placeholder{
    color:#59637e;
}

.passwordWrap{
    position:relative;
}

.showPassword{
    position:absolute;

    right:7px;
    top:7px;

    height:40px;

    padding:0 10px;

    background:#ffffff08;

    border-radius:9px;

    color:#8993ad;

    font-size:12px;
}

/* Основная кнопка */

.submit{
    width:100%;

    padding:14px;

    border-radius:13px;

    margin-top:4px;

    background:
        linear-gradient(135deg,var(--purple),var(--blue));

    box-shadow:
        0 10px 30px #6655ff33;
}

.submit:hover{
    transform:translateY(-2px);
}

.bottomText{
    text-align:center;

    color:#7f89a4;

    font-size:13px;

    margin-top:15px;
}

.link{
    color:#9484ff;

    cursor:pointer;
}

.error{
    min-height:18px;

    color:#ff6d8a;

    font-size:12px;

    margin-bottom:5px;
}

@media(max-width:800px){

    header{
        padding:0 18px;
    }

    .features{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:560px){

    body{
        overflow:auto;
    }

    header{
        height:68px;
    }

    main{
        min-height:calc(100vh - 68px);
        height:auto;
        padding:55px 15px;
    }

    .headerButtons .loginButton{
        display:none;
    }

    h1{
        font-size:64px;
        letter-spacing:-3px;
    }

    .description{
        font-size:15px;
    }

    .features{
        grid-template-columns:1fr;
        margin-top:45px;
    }

    .feature{
        text-align:center;
    }

    .modalCard{
        padding:23px;
    }
}
</style>
</head>

            class="loginButton"
            onclick="openLogin()">
            Войти
        </button>
